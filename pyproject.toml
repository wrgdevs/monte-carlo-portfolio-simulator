[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-portfolio-simulator"
version = "0.2.0"
description = "Monte Carlo risk simulator for single assets and correlated portfolios"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.6",
  "yfinance>=0.2",
  "streamlit>=1.32.0",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
